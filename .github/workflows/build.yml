name: Android CI (Debug Build)

# 触发条件：推送到 main、对 main 的 PR、以及手动触发
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# 同一分支并发只保留最新一次，避免排队浪费
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      # 所有步骤共享的 Android SDK 路径（手动安装到工作区）
      ANDROID_HOME: ${{ github.workspace }}/android-sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1) JDK 17 —— Gradle 9 / AGP 9 / Kotlin 2.4 都要求 Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 2) 手动安装 Android SDK 命令行工具（规避旧版 setup-android 会执行
      #    已废弃的 `sdkmanager tools` 导致失败的问题）
      - name: Setup Android SDK (manual)
        run: |
          SDK="$ANDROID_HOME"
          mkdir -p "$SDK/cmdline-tools"
          echo "Downloading command-line tools..."
          curl -fsSL -o /tmp/cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          export PATH="$PATH:$SDK/cmdline-tools/latest/bin"
          echo "Accepting SDK licenses..."
          yes | sdkmanager --licenses >/dev/null
          echo "Installing SDK packages..."
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;37.0.0"

      # 3) 让 Gradle 能定位 SDK（双重保险：env + local.properties）
      - name: Configure local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # 4) gradlew 可执行权限（Windows 上行尾可能导致丢失）
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5) Gradle 包装器与缓存（自动缓存依赖与构建产物）
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 6) 实际构建 Debug 包（arm64-v8a 单 ABI，--no-daemon 适配 CI）
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # 7) 产物：上传 debug APK 供下载
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
