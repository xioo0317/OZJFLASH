name: Android CI (Debug Build)

# 触发条件：推送到 main、对 main 的 PR、以及手动触发
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# 同一分支并发只保留最新一次，避免排队浪费
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    # 关键权限：读写 contents 以便后续可自动打 tag / 上传 release（按需）
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1) JDK 17 —— Gradle 9 / AGP 9 / Kotlin 2.4 都要求 Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 2) 安装 Android SDK 命令行工具（自动接受 license 由下一步处理）
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 3) 接受 license 并安装所需 SDK 包
      #    - platform-tools      : adb/设备工具
      #    - platforms;android-37: compileSdk 37 所需平台
      #    - build-tools;37.0.0  : AGP 打包依赖
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;37.0.0"

      # 4) gradlew 可执行权限（Windows 上行尾可能导致丢失）
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5) Gradle 包装器与缓存（自动缓存依赖与构建产物）
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 6) 实际构建 Debug 包（arm64-v8a 单 ABI，--no-daemon 适配 CI）
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # 7) 产物：上传 debug APK 供下载
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
