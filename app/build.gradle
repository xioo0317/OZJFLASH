plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
    // miuix-nav 的 navBackStackSaver 依赖 kotlinx.serialization 保存路由栈，
    // Route 及子类的 @Serializable 由该编译器插件生成 serializer
    alias(libs.plugins.kotlin.serialization)
    // Parcelize 由 AGP 内置的 Kotlin 插件提供，按 KernelSU 的写法不带版本号声明
    id 'kotlin-parcelize'
}

android {
    namespace 'com.android.ozjflash'
    compileSdk 37

    defaultConfig {
        applicationId 'com.android.ozjflash'
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName '1.5'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk {
            // 原生库仅提供 arm64-v8a 版本
            abiFilters 'arm64-v8a'
        }
    }

    // 必须解压原生库：工具本体以 lib*.so 形式分发，运行时要 exec 它们，
    // 若留在 APK 内（页对齐、不解压）就没有可执行的路径了
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlin {
        compilerOptions {
            // miuix-nav 等依赖以 JVM 21 字节码发布，内联到 17 会报错
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)
            // Material3 Expressive 与 miuix 仍处于实验阶段
            freeCompilerArgs.addAll(
                "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api",
                "-opt-in=androidx.compose.material3.ExperimentalMaterial3ExpressiveApi",
                "-opt-in=androidx.compose.foundation.ExperimentalFoundationApi",
            )
        }
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.navigationevent.compose

    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.ui
    implementation libs.androidx.ui.graphics
    implementation libs.androidx.ui.tooling.preview
    implementation libs.androidx.material3
    implementation libs.androidx.material.icons.extended
    implementation libs.material.kolor

    // miuix-nav 的 navBackStackSaver 用 JSON 序列化路由栈
    implementation libs.kotlinx.serialization.json

    // Miuix 主体：另一套完整 UI 皮肤，运行时可在设置里与 Material 主体切换
    implementation libs.miuix.ui
    implementation libs.miuix.icons
    implementation libs.miuix.nav
    implementation libs.miuix.preference
    implementation libs.miuix.blur

    debugImplementation libs.androidx.ui.tooling
    debugImplementation libs.androidx.ui.test.manifest
}
